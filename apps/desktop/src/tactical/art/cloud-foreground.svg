<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>半透明浅色前景云海临时素材</title>
  <filter id="mist" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".004 .007" numOctaves="3" seed="37" stitchTiles="stitch"/>
    <feGaussianBlur stdDeviation="5"/>
    <feColorMatrix values="0 0 0 0 .89  0 0 0 0 .93  0 0 0 0 .93  .9 .9 .9 0 -.8"/>
  </filter>
  <rect width="1024" height="1024" filter="url(#mist)"/>
</svg>
