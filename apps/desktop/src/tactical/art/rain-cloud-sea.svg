<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>雨层深色云海临时素材</title>
  <filter id="sea" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".007 .013" numOctaves="4" seed="61" stitchTiles="stitch"/>
    <feGaussianBlur stdDeviation="3"/>
    <feColorMatrix values=".12 .12 .12 0 -.10  .15 .15 .15 0 -.10  .17 .17 .17 0 -.10  0 0 0 0 1"/>
  </filter>
  <rect width="1024" height="1024" fill="#15252f" filter="url(#sea)"/>
</svg>
