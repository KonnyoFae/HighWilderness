<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>云层灰暗云海临时素材</title>
  <filter id="sea" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".009 .014" numOctaves="4" seed="27" stitchTiles="stitch"/>
    <feGaussianBlur stdDeviation="2"/>
    <feColorMatrix values=".25 .25 .25 0 -.10  .25 .25 .25 0 -.07  .25 .25 .25 0 -.04  0 0 0 0 1"/>
  </filter>
  <rect width="1024" height="1024" fill="#47565d" filter="url(#sea)"/>
</svg>
